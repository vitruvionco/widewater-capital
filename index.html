<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widewater Capital</title>
  <meta name="description" content="Widewater Capital">
  <link rel="canonical" href="https://widewatercapital.com/">
  <meta name="theme-color" content="#0a131c">
  <meta name="color-scheme" content="dark">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Widewater Capital">
  <meta property="og:title" content="Widewater Capital">
  <meta property="og:url" content="https://widewatercapital.com/">
  <meta property="og:image" content="https://widewatercapital.com/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preload" as="image" type="image/webp" href="assets/img/logo.webp"
        imagesrcset="assets/img/logo-800.webp 800w, assets/img/logo.webp 1482w"
        imagesizes="(min-width: 760px) 600px, 80vw">
  <link rel="stylesheet" href="assets/css/styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Widewater Capital",
    "url": "https://widewatercapital.com/",
    "logo": "https://widewatercapital.com/assets/img/icon-192.png"
  }
  </script>
</head>
<body>
  <main class="splash">
    <picture>
      <source type="image/webp"
              srcset="assets/img/bg-800.webp 800w, assets/img/bg-1280.webp 1280w, assets/img/bg-1672.webp 1672w"
              sizes="100vw">
      <img class="splash-bg"
           src="assets/img/bg-1672.jpg"
           srcset="assets/img/bg-800.jpg 800w, assets/img/bg-1280.jpg 1280w, assets/img/bg-1672.jpg 1672w"
           sizes="100vw" width="1672" height="941" alt="" decoding="async">
    </picture>

    <h1 class="splash-logo">
      <picture>
        <source type="image/webp"
                srcset="assets/img/logo-800.webp 800w, assets/img/logo.webp 1482w"
                sizes="(min-width: 760px) 600px, 80vw">
        <img src="assets/img/logo.png"
             srcset="assets/img/logo-800.png 800w, assets/img/logo.png 1482w"
             sizes="(min-width: 760px) 600px, 80vw"
             width="1482" height="608" alt="Widewater Capital" fetchpriority="high">
      </picture>
    </h1>

    <footer class="splash-footer">
      © <span id="year">2026</span> Widewater Capital
    </footer>
  </main>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
